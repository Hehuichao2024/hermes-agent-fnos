name: Build fpk

on:
  push:
    branches: [main]
    paths:
      - 'hermes-agent.fpk.dir/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app.tgz (docker + ui)
        run: |
          cd hermes-agent.fpk.dir/app
          tar czf ../../app.tgz docker/ ui/

      - name: Build .fpk package
        run: |
          SRC="hermes-agent.fpk.dir"
          VERSION=$(grep '^version' "$SRC/manifest" | awk -F'=' '{print $2}' | xargs)
          FPK="hermes-agent-${VERSION}.fpk"

          # app.tgz 移入源目录，避免 tar 的 ../ 警告
          mv app.tgz "$SRC/"
          cd "$SRC"
          tar czf "../$FPK" \
            manifest ICON.PNG ICON_256.PNG \
            config/ cmd/ wizard/ app.tgz

          echo "=== 构建完成 ==="
          ls -lh "../$FPK"

      - name: Verify fpk integrity
        run: |
          FPK=$(ls hermes-agent-*.fpk)
          echo "验证: $FPK"
          tar tzf "$FPK" | sort
          echo "--- app.tgz 内容 ---"
          tar xzf "$FPK" app.tgz -O | tar tz | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-fpk
          path: hermes-agent-*.fpk

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hermes-agent-*.fpk
          generate_release_notes: true
