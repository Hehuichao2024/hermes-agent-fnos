name: Build fpk

on:
  push:
    branches: [main]
    paths:
      - 'hermes-agent.fpk.dir/**'
      - '.github/workflows/build-fpk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app.tgz (docker + ui)
        run: |
          cd hermes-agent.fpk.dir/app
          tar czf ../../app.tgz docker/ ui/

      - name: Build .fpk package
        id: build
        run: |
          SRC="hermes-agent.fpk.dir"
          VERSION=$(grep '^version' "$SRC/manifest" | awk -F'=' '{print $2}' | xargs)
          FPK="hermes-agent-${VERSION}.fpk"

          mv app.tgz "$SRC/"
          cd "$SRC"
          tar czf "../$FPK" \
            manifest ICON.PNG ICON_256.PNG \
            config/ cmd/ wizard/ app.tgz

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "fpk=$FPK" >> "$GITHUB_OUTPUT"
          echo "=== 构建完成 ==="
          ls -lh "../$FPK"

      - name: Verify fpk integrity
        run: |
          FPK=$(ls hermes-agent-*.fpk)
          echo "验证: $FPK"
          tar tzf "$FPK" | sort
          echo "--- app.tgz 内容 ---"
          tar xzf "$FPK" app.tgz -O | tar tz | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-fpk
          path: hermes-agent-*.fpk

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: v${{ steps.build.outputs.version }}
          files: hermes-agent-*.fpk
          generate_release_notes: true
          make_latest: true
